#* 这是该项目的核心配置文件.
#* 对于必填的配置数据, 配置行上方会带有`#?`.
#* 只有当所有必填配置被正常赋值后, 程序才能正常运行.

#* Spring Boot 元信息
spring.application.name=TCPService

#* Spring Boot 数据库配置

#* 可选: 如果你的数据库架构不使用"light"作为名称, 该项需要修改.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/light}

#* 可选: 如果你的数据库用户名称并非"root", 该项必须修改.
spring.datasource.username=${DB_USERNAME:root}

#? 必填: 否则数据库无法连接.
spring.datasource.password=${DB_PASSWORD:DOOM1Sf0r3v3r}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#* HikariCP 连接池配置
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

#* MyBatis 配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.wenhua.tcpservice.mapper.handler

#* 可选: 如果这个端口在你的部署服务器上不可用/被占用了.
server.port=18081

#* Spring AI 相关配置

#! 警告: 请不要移除这个配置. Spring AI的自动装配强制要求`spring.ai.openai.api-key`, 因此我们准备了[[AIAutowiredConfig]]来处理模拟AI回复.
#! 一旦移除这个配置, 程序将无法正常启动.
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

#? 必填: 未填不会导致程序启动失败, 但会使AI集成采用mock fallback.
spring.ai.openai.api-key=${AI_API_KEY:}

#* 可选: 如果你的AI API不是Deepseek, 该项应该被修改.
spring.ai.openai.base-url=${AI_API_URL:https://api.deepseek.com}

#* 可选: 如果AI API不使用Deepseek, 或者不打算使用该模型, 该项应该被修改.
spring.ai.openai.chat.options.model=${AI_MODEL:deepseek-v4-flash}

#* 可选: 在一般情况下没有必要修改.
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.7}

#* JWT 配置

#* 可选
jwt.sign-key=${JWT_SIGN_KEY:c9c3f12534894b8cbb94d61971415cd80145a3e6d5c8e2748161798abc9e1cc69ddc7418f1d252d6cfd94a6bad0a5674fe270794ea5d1c82d58f3a130210bc6f}

#* 可选
jwt.expire=${JWT_EXPIRE:43200000}

#* 可选: 默认7天时间
jwt.refresh-expire=${JWT_REFRESH_EXPIRE:604800000}

#* TCP 服务器配置
#? 所有的TCP服务器配置都可以自定义.

# 心跳超时(秒)，设备 N 秒无数据上报视为离线
tcp.heartbeat.timeout=${TCP_HEARTBEAT_TIMEOUT:120}
# 心跳检查间隔(秒)
tcp.heartbeat.interval=${TCP_HEARTBEAT_INTERVAL:30}
# 线程池核心线程数
tcp.thread.pool.core-size=${TCP_THREAD_POOL_CORE:4}
# 线程池最大线程数
tcp.thread.pool.max-size=${TCP_THREAD_POOL_MAX:200}
# 线程池空闲线程存活时间(秒)
tcp.thread.pool.keep-alive=${TCP_THREAD_POOL_KEEP_ALIVE:60}
# 线程池任务队列容量
tcp.thread.pool.queue-capacity=${TCP_THREAD_POOL_QUEUE:1000}

#* 能源账单配置

#* 可选: 电价(元/度)
electricity.price=${ELECTRICITY_PRICE:0.6}

#* 可选: 路灯默认功率(瓦), 当设备表中未设置时会使用该默认值
lamp.default-power-watt=${LAMP_DEFAULT_POWER_WATT:150}