spring.application.name=TCPService

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/light}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.wenhua.tcpservice.mapper.handler

server.port=18081

#* Spring AI 相关配置

#! 警告: 请不要移除这个配置. Spring AI的自动装配强制要求`spring.ai.openai.api-key`, 因此我们准备了[[AIAutowiredConfig]]来处理模拟AI回复.
#! 一旦移除这个配置, 程序将无法正常启动.
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-v4-flash
spring.ai.openai.chat.options.temperature=0.7

#* JWT 配置
#* 从环境变量 JWT_SIGN_KEY 读取签名密钥，未设置时使用内置默认值
jwt.sign-key=${JWT_SIGN_KEY:c9c3f12534894b8cbb94d61971415cd80145a3e6d5c8e2748161798abc9e1cc69ddc7418f1d252d6cfd94a6bad0a5674fe270794ea5d1c82d58f3a130210bc6f}
jwt.expire=${JWT_EXPIRE:43200000}
# 刷新令牌过期时间（毫秒），默认 7 天
jwt.refresh-expire=${JWT_REFRESH_EXPIRE:604800000}

#* TCP 服务器配置
# 心跳超时（秒），设备 N 秒无数据上报视为离线
tcp.heartbeat.timeout=${TCP_HEARTBEAT_TIMEOUT:120}
# 心跳检查间隔（秒）
tcp.heartbeat.interval=${TCP_HEARTBEAT_INTERVAL:30}
# 线程池核心线程数
tcp.thread.pool.core-size=${TCP_THREAD_POOL_CORE:4}
# 线程池最大线程数
tcp.thread.pool.max-size=${TCP_THREAD_POOL_MAX:200}
# 线程池空闲线程存活时间（秒）
tcp.thread.pool.keep-alive=${TCP_THREAD_POOL_KEEP_ALIVE:60}
# 线程池任务队列容量
tcp.thread.pool.queue-capacity=${TCP_THREAD_POOL_QUEUE:1000}